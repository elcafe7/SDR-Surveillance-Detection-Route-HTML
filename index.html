<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDR Quick – Foot or Driving</title>
    <style>
        :root {
            --bg: #000;
            --glass: rgba(35,35,40,0.85);
            --accent: #0a84ff;
            --green: #30d158;
            --red: #ff3b30;
            --text: #ffffff;
            --sub: #a0a0a5;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            padding:16px;
        }
        .container {
            width:100%;
            max-width:480px;
            margin:0 auto;
            background:var(--glass);
            backdrop-filter:blur(32px);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:28px;
            box-shadow:0 20px 60px rgba(0,0,0,0.7);
        }
        .progress {
            height:6px;
            background:rgba(255,255,255,0.08);
            border-radius:3px;
            margin-bottom:24px;
            overflow:hidden;
        }
        .progress-fill {
            height:100%;
            background:var(--accent);
            width:0%;
            transition:width 0.5s ease;
        }
        h1 { font-size:26px; text-align:center; margin-bottom:8px; }
        .subtitle { color:var(--sub); text-align:center; font-size:14px; margin-bottom:32px; }
        .mode-grid {
            display:grid;
            gap:20px;
        }
        .mode-btn {
            padding:28px;
            font-size:22px;
            border-radius:16px;
            border:1px solid rgba(255,255,255,0.15);
            background:rgba(255,255,255,0.06);
            color:var(--text);
            cursor:pointer;
            text-align:center;
            transition:0.2s;
        }
        .mode-btn:hover {
            background:rgba(10,132,255,0.15);
            border-color:var(--accent);
        }
        .mode-btn span { display:block; font-size:14px; color:var(--sub); margin-top:8px; }
        .route, .result { display:none; }
        .leg {
            text-align:center;
            margin:32px 0;
        }
        .leg-title { font-size:20px; margin-bottom:16px; }
        .leg-desc { color:var(--sub); font-size:14px; margin-bottom:32px; line-height:1.4; }
        .answer-buttons {
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .btn {
            padding:20px;
            font-size:20px;
            border-radius:999px;
            border:none;
            cursor:pointer;
            color:white;
        }
        .btn-yes { background:var(--red); }
        .btn-no  { background:var(--green); }
        .btn-reset {
            background:rgba(255,255,255,0.1);
            color:var(--text);
            padding:14px;
            font-size:16px;
            margin-top:24px;
        }
        .outcome {
            margin:32px 0;
            padding:24px;
            border-radius:16px;
            font-size:17px;
            line-height:1.45;
        }
        .outcome.clear { background:rgba(48,209,88,0.18); border:1px solid var(--green); }
        .outcome.alert { background:rgba(255,59,48,0.18); border:1px solid var(--red); }
    </style>
</head>
<body>

<div class="container">

    <!-- MODE SELECTION -->
    <div id="mode-select">
        <h1>Start SDR</h1>
        <div class="subtitle">Choose how you're moving</div>
        <div class="mode-grid">
            <div class="mode-btn" onclick="startRoute('foot')">
                I'm walking
                <span>Pedestrian SDR</span>
            </div>
            <div class="mode-btn" onclick="startRoute('driving')">
                I'm driving
                <span>Vehicle SDR</span>
            </div>
        </div>
    </div>

    <!-- FOOT ROUTE -->
    <div id="foot-route" class="route">
        <h1>Foot SDR</h1>
        <div class="progress"><div class="progress-fill" id="foot-progress"></div></div>
        <div class="leg" id="foot-leg"></div>
        <div class="answer-buttons" id="foot-buttons"></div>
        <button class="btn-reset" onclick="reset()">New Route</button>
    </div>

    <!-- DRIVING ROUTE -->
    <div id="driving-route" class="route">
        <h1>Driving SDR</h1>
        <div class="progress"><div class="progress-fill" id="driving-progress"></div></div>
        <div class="leg" id="driving-leg"></div>
        <div class="answer-buttons" id="driving-buttons"></div>
        <button class="btn-reset" onclick="reset()">New Route</button>
    </div>

    <!-- FINAL RESULT (shared) -->
    <div id="result" class="result">
        <h2>Route Complete</h2>
        <div id="outcome" class="outcome"></div>
        <button class="btn-reset" onclick="reset()">Start Over</button>
    </div>

</div>

<script>
const footLegs = [
    {t:"Leg 1 — 3 Right Turns", d:"Three consecutive right turns (block loop). Check windows/reflections."},
    {t:"Leg 2 — Sudden Stop", d:"Stop at shop window (pretend phone check). Watch for pauses."},
    {t:"Leg 3 — Double-Back", d:"Turn around, walk back one block. Anyone reverse?"},
    {t:"Leg 4 — Door Switch", d:"Enter store, exit different door."},
    {t:"Leg 5 — Final Reversal", d:"180° turn, retrace steps."}
];

const drivingLegs = [
    {t:"Leg 1 — Three Rights", d:"Three consecutive right turns (box). Check mirrors."},
    {t:"Leg 2 — U-Turn", d:"Safe U-turn. Watch rearview."},
    {t:"Leg 3 — Slow & Accelerate", d:"Drop to 20 mph then speed up. Match?"},
    {t:"Leg 4 — Gas Pause", d:"Pull in, brief stop, same exit."},
    {t:"Leg 5 — Cul-de-Sac", d:"Enter cul-de-sac, loop, exit."}
];

let currentLegs = [];
let currentIdx = 0;
let followCount = 0;
let currentMode = '';

function startRoute(mode) {
    currentMode = mode;
    currentLegs = mode === 'foot' ? footLegs : drivingLegs;
    currentIdx = 0;
    followCount = 0;

    document.getElementById('mode-select').style.display = 'none';
    document.getElementById(mode + '-route').style.display = 'block';
    document.getElementById('result').style.display = 'none';

    showCurrentLeg();
}

function showCurrentLeg() {
    if (currentIdx >= currentLegs.length) {
        showFinal();
        return;
    }

    const leg = currentLegs[currentIdx];
    const areaId = currentMode + '-leg';
    const btnsId = currentMode + '-buttons';
    const progId = currentMode + '-progress';

    document.getElementById(areaId).innerHTML = `
        <div class="leg-title">${leg.t}</div>
        <div class="leg-desc">${leg.d}</div>
    `;

    document.getElementById(btnsId).innerHTML = `
        <button class="btn btn-yes" onclick="recordAnswer(true)">They followed / matched</button>
        <button class="btn btn-no" onclick="recordAnswer(false)">No match / clean</button>
    `;

    const pct = (currentIdx / currentLegs.length) * 100;
    document.getElementById(progId).style.width = pct + '%';
}

function recordAnswer(yes) {
    if (yes) followCount++;
    currentIdx++;
    showCurrentLeg();
}

function showFinal() {
    document.getElementById(currentMode + '-route').style.display = 'none';
    document.getElementById('result').style.display = 'block';

    const outcome = document.getElementById('outcome');
    if (followCount === 0) {
        outcome.className = 'outcome clear';
        outcome.innerHTML = `
            You're probably clear<br><br>
            • Zero matches<br>
            • Extremely unlikely tail<br>
            • Stay alert anyway
        `;
    } else {
        outcome.className = 'outcome alert';
        outcome.innerHTML = `
            Possible tail (${followCount} match${followCount>1?'es':''})<br><br>
            • Go overt immediately<br>
            • Head to busy public place<br>
            • Call 911 calmly<br>
            • Give location + description
        `;
    }
}

function reset() {
    document.getElementById('result').style.display = 'none';
    document.getElementById('mode-select').style.display = 'block';
    document.getElementById('foot-progress').style.width = '0%';
    document.getElementById('driving-progress').style.width = '0%';
}
</script>
</body>
</html>
